<main class="page">
  <header class="topbar">
    <a class="icon-button" routerLink="/" aria-label="Volver al inicio">
      <span aria-hidden="true">←</span>
    </a>
    <app-brand-logo />
    <span class="topbar__spacer" aria-hidden="true"></span>
  </header>

  <section class="join" aria-labelledby="join-title">
    <app-brand-logo variant="hero" [showWordmark]="false" />

    <h1 id="join-title" class="join__title">Entra a la sala</h1>
    <p class="join__lede">Ingresa el código que te compartió el DJ.</p>

    @if (joining()) {
      <div class="joining" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <p>Conectando con la sala…</p>
      </div>
    } @else {
      <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <label class="field">
          <span class="field__label">Código de sala</span>
          <input
            class="field__input"
            [class.field__input--invalid]="showCodeError()"
            type="text"
            formControlName="code"
            maxlength="10"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            [attr.aria-describedby]="showCodeError() ? 'code-help code-error' : 'code-help'"
            [attr.aria-invalid]="showCodeError() ? 'true' : null"
            placeholder="Ej. X6CCXUTSJ8"
          />
          <span id="code-help" class="field__help">10 caracteres · letras y números</span>
          @if (showCodeError()) {
            <span id="code-error" class="field__error" role="alert">{{ codeErrorMessage() }}</span>
          }
        </label>

        @if (errorMessage()) {
          <p class="form__error" role="alert">{{ errorMessage() }}</p>
        }

        <button class="button button--primary button--full" type="submit">
          Entrar a la sala
        </button>
      </form>
    }

    <p class="join__help">¿No tienes el código? Pídeselo al organizador.</p>
  </section>
</main>
