<main class="page">
  <section class="panel">
    <header class="brand">
      <span class="brand__mark" aria-hidden="true">DJ</span>
      <h1 class="brand__title">DJ Requests</h1>
      <p class="brand__subtitle">Pide una canción para esta sala.</p>
    </header>

    @if (joining()) {
      <div class="joining" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <p>Conectando con la sala…</p>
      </div>
    } @else {
      <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <label class="field">
          <span class="field__label">Código de sala</span>
          <input
            class="field__input"
            [class.field__input--invalid]="showCodeError()"
            type="text"
            formControlName="code"
            maxlength="10"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            aria-describedby="code-help"
            placeholder="ABCDEFGHIJ"
          />
          <span id="code-help" class="field__help">
            Son 10 caracteres. Lo encuentras en el QR o en la app del DJ.
          </span>
          @if (showCodeError()) {
            <span class="field__error" role="alert">{{ codeErrorMessage() }}</span>
          }
        </label>

        @if (errorMessage()) {
          <p class="form__error" role="alert">{{ errorMessage() }}</p>
        }

        <button class="button button--primary" type="submit">Entrar</button>
      </form>
    }
  </section>

  @if (fromLink()) {
    <a class="back-link" routerLink="/">Volver al inicio</a>
  }
</main>
