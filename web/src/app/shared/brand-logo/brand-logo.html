<div
  class="brand"
  [class.brand--hero]="variant() === 'hero'"
  [attr.role]="showWordmark() ? null : 'img'"
  [attr.aria-label]="showWordmark() ? null : 'DJ Requests'"
>
  <span class="brand__mark">
    @if (variant() === 'hero') {
      <svg class="brand__waves" viewBox="0 0 240 240" aria-hidden="true">
        <path
          class="brand__wave brand__wave--outer"
          d="M28 120 A92 92 0 0 1 212 120"
        />
        <path class="brand__wave brand__wave--middle" d="M56 120 A64 64 0 0 1 184 120" />
        <path class="brand__wave brand__wave--inner" d="M84 120 A36 36 0 0 1 156 120" />
      </svg>
    }

    <svg class="brand__symbol" viewBox="0 0 56 56" aria-hidden="true">
      <path
        d="M14 8 L14 42 Q14 50 28 50 Q42 50 50 42 L50 8 Q42 8 28 8 L14 8 Z"
        fill="none"
        stroke="currentColor"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <rect x="19" y="27" width="5" height="13" rx="1.5" fill="currentColor" />
      <rect x="26" y="18" width="5" height="22" rx="1.5" fill="currentColor" />
      <rect x="33" y="9" width="5" height="31" rx="1.5" fill="currentColor" />
    </svg>
  </span>

  @if (showWordmark()) {
    <span class="brand__wordmark">DJ Requests</span>
  }
</div>
